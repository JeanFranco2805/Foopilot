<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Empleados</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/welcome/auth/SignEmployee.css') }}">
    <script src="{{ url_for('static', filename='js/auth/SignEmployee.js') }}"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background: url('https://cdn.pixabay.com/photo/2024/02/23/00/33/ai-generated-8591048_1280.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .register-container {
            background: rgba(255, 255, 255, 0.8);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            width: 400px;
            text-align: center;
        }
        .register-box h1 {
            color: #2d3436;
            font-size: 2rem;
            margin-bottom: 10px;
        }
        .register-box p {
            font-size: 1rem;
            color: #636e72;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 1rem;
            color: #2d3436;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #dfe6e9;
            border-radius: 5px;
            background: #f5f5f5;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus {
            border-color: #0984e3;
            background: #fff;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #0984e3;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #74b9ff;
        }
        .back-btn {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            background: #2d3436;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s;
        }
        .back-btn:hover {
            background: #636e72;
        }
        @media (max-width: 768px) {
            .register-container {
                width: 90%;
                padding: 20px;
            }
            .register-box h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
<div class="register-container">
    <div class="register-box">
        <h1>Registrar Empleado</h1>
        <p>Por favor complete los campos</p>
    </div>
    <form id="registerForm">
        <div class="input-group">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" required>
        </div>
        <div class="input-group">
            <label for="apellido">Apellido</label>
            <input type="text" id="apellido" required>
        </div>
        <div class="input-group">
            <label for="correo">Correo Electrónico</label>
            <input type="email" id="correo" required>
        </div>
        <div class="input-group">
            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono" required>
        </div>
        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" required>
        </div>
        <button type="submit" class="btn">Registrar</button>
    </form>
    <button class="back-btn" onclick="window.location.href='/'">Volver al Menú Principal</button>
</div>
</body>
</html>
