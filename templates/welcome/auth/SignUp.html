<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Restaurante</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='css/welcome/auth/SignUp.css') }}">
    <script src="{{ url_for('static',filename='js/auth/SignUp.js') }}"></script>
</head>
<body>
<div class="register-container">
    <div class="register-box">
        <h1>Regístrate</h1>
        <form action="{{ url_for('auth.Login') }}">
            <!-- Nombre -->
            <div class="input-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" required>
            </div>
            <!-- Correo -->
            <div class="input-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" required>
            </div>
            <!-- Contraseña -->
            <div class="input-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>
            <!-- Confirmar Contraseña -->
            <div class="input-group">
                <label for="confirm-password">Confirmar Contraseña</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>
            <!-- Botón de Registro -->
            <button type="submit" class="btn" id="buttonSignUp">Crear Cuenta</button>
        </form>
        <p class="login-link">¿Ya tienes cuenta? <a href={{ url_for('auth.Login') }}>Inicia sesión</a></p>
    </div>
</div>
</body>
</html>
