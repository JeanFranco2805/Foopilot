<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/welcome/home/Admin.css') }}">
    <script src="{{ url_for('static', filename='js/AdminPanel.js') }}"></script>
</head>
<body>
<div class="admin-container">
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2>Panel Administrativo</h2>
        </div>
        <div class="sidebar-title"></div>
        <nav>
            <ul>
                <li><a href="{{ url_for('home.adminPanel') }}">Menú Principal</a></li>
                <li><a href="{{ url_for('home.registerEmployee') }}">Empleados</a></li>
                <li><a href="{{ url_for('home.ordersPanel') }}">Pedidos</a></li>
                <li><a href="{{ url_for('home.mesasPanel') }}">Mesas</a></li>
                <li><a href="{{ url_for('home.historyPane') }}">Historial</a></li>
            </ul>
        </nav>

        <div class="sidebar-profile">
            <img src="https://via.placeholder.com/50" alt="Foto de perfil">
            <div class="profile-info">
                <p><strong>Juan Pérez</strong></p>
                <p>Mesero</p>
            </div>
            <button class="logout-btn">Cerrar Sesión</button>
        </div>
    </aside>

    <main class="main-content">
        <header>
            <h1>Menú del Restaurante</h1>
            <p>Administra los productos disponibles en el menú.</p>
        </header>
        <div class="category-menu-container">
            <h2>Categorías</h2>
            <div id="categories"></div>
            <button id="add-category-btn" class="add-category-btn">Añadir Categoría</button>
        </div>

        <section class="menu-items" id="menu">
        </section>
        <div class="add-card-container">
            <a id="add-card-btn" class="add-card-btn" href="{{ url_for('home.addProduct') }}" >+</a>
        </div>
    </main>

</div>
</body>
</html>
