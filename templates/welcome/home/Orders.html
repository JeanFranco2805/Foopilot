<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/welcome/home/Orders.css') }}">
    <script src="{{ url_for('static', filename='js/Orders.js') }}"></script>
</head>
<body>
<div class="admin-container">
    <aside class="sidebar">
        <div class="sidebar-header"></div>
        <div class="sidebar-title"><h1>Foopilot</h1></div>

        <nav>
            <ul>
                <li><a href="{{ url_for('home.adminPanel') }}">Menú Principal</a></li>
                <li><a href="{{ url_for('home.registerEmployee') }}">Empleados</a></li>
                <li><a href="{{ url_for('home.ordersPanel') }}">Pedidos</a></li>
                <li><a href="{{ url_for('home.mesasPanel') }}">Mesas</a></li>
                <li><a href="{{ url_for('home.statistics') }}">Estadisticas</a></li>
            </ul>
        </nav>
        <div class="sidebar-profile">
            <img id="profile-picture" src="https://via.placeholder.com/50" alt="Foto de perfil"
                 style="cursor: pointer;">
            <div class="profile-info">
                <p><strong>Juan Pérez</strong></p>
                <p>Mesero</p>
            </div>
            <button class="logout-btn" id="logoutButton">Cerrar Sesión</button>
        </div>
    </aside>

    <main class="main-content">
        <header>
            <h1>Gestión de Pedidos</h1>
        </header>
        <div class="table-container">
            <a class="add-btn" href="{{ url_for('home.addOrders') }}">Insertar Nuevo Pedido</a>
            <div class="filter-container">
                <input type="text" id="filterMesero" placeholder="Buscar por mesero..." />
                <select id="filterEstado">
                    <option value="">Filtrar por estado</option>
                    <option value="Pendiente">Pendiente</option>
                    <option value="En Proceso">En Proceso</option>
                    <option value="Completado">Completado</option>
                </select>
                <div class="filter-date">
                    <label for="filterFechaInicio">Desde:</label>
                    <input type="date" id="filterFechaInicio" />
                </div>
                <div class="filter-date">
                    <label for="filterFechaFin">Hasta:</label>
                    <input type="date" id="filterFechaFin" />
                </div>
                <button id="filterButton" class="filter-btn">Filtrar</button>
                <button id="clearFilterButton" class="filter-btn clear-btn">Limpiar Filtros</button>
            </div>


            <table class="orders-table">
                <thead>
                <tr>
                    <th>ID Pedido</th>
                    <th># Mesa</th>
                    <th>Mesero</th>
                    <th>Total Pedido</th>
                    <th>Fecha</th>
                    <th>Estado</th>
                    <th>Detalles</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
            <div class="pagination-container"></div>

        </div>
    </main>
</div>

<div id="detallesModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Detalles del Pedido</h2>
        <div class="modal-body">
        </div>
    </div>
</div>

</body>
</html>
