<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Producto</title>
    <link rel="stylesheet" href="{{ url_for('static',filename='css/welcome/home/forms/ProductsToMenu.css') }}">
    <script src="{{ url_for('static',filename='js/ProductsToMenu.js')}}"></script>
</head>
<body>
<div class="form-container">
    <h1>Agregar Producto</h1>
    <form enctype="multipart/form-data">
        <!-- Nombre del producto -->
        <div class="input-group">
            <label for="product-name">Nombre</label>
            <input type="text" id="product-name" name="product-name" placeholder="Ej. Pizza Margarita" required>
        </div>
        <!-- Descripción del producto -->
        <div class="input-group">
            <label for="product-description">Descripción</label>
            <textarea id="product-description" name="product-description" rows="3" placeholder="Escribe una breve descripción..." required></textarea>
        </div>
        <!-- Precio del producto -->
        <div class="input-group">
            <label for="product-price">Precio</label>
            <input type="number" id="product-price" name="product-price" placeholder="Ej. 15.99" step="0.01" required>
        </div>
        <!-- Imagen del producto -->
        <div class="input-group">
            <label for="product-image">Imagen</label>
            <input type="file" id="product-image" name="product-image" accept="image/*" required>
        </div>
        <!-- Botón para enviar -->
        <button type="submit" class="btn" id="btnSubmit" onsubmit="handleSubmit">Agregar al Menú</button>
    </form>
</div>

<!-- Contenedor para mostrar los productos -->
<div id="product-list">
    <!-- Aquí se cargarán los productos dinámicamente -->
</div>

</body>
</html>
