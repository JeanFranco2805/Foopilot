<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Producto</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="{{ url_for('static',filename='css/welcome/home/forms/UpdateProductsToMenu.css') }}">
    <script defer src="{{ url_for('static',filename='js/forms/UpdateProductToMenu.js') }}"></script>
</head>
<body>
<div class="form-container">
    <h1>Editar Producto</h1>
    <a href="{{ url_for('home.adminPanel') }}" class="back-to-menu">← Volver al Menú</a>
    <form id="editProductForm">
        <div class="form-group">
            <label for="productName">Nombre del Producto:</label>
            <input type="text" id="productName" name="productName" required>
        </div>

        <div class="form-group">
            <label for="productPrice">Precio:</label>
            <input type="number" id="productPrice" name="productPrice" step="0.01" required>
        </div>

        <div class="form-group">
            <label for="productCategory">Categoría:</label>
            <select id="productCategory" name="productCategory" required>
            </select>
        </div>

        <div class="form-group">
            <label for="productDescription">Descripción:</label>
            <textarea id="productDescription" name="productDescription" rows="4" required></textarea>
        </div>

        <div class="form-group">
            <label for="productImage">Imagen del Producto:</label>
            <input type="file" id="productImage" name="productImage" accept="image/*">
        </div>

        <button type="submit">Actualizar Producto</button>
    </form>
</div>
</body>
</html>
